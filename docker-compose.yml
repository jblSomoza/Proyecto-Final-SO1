services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_datos:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  productor:
    build: ./productor
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PYTHONUNBUFFERED: "1"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  consumidor1:
    image: proyecto-so1-consumidor:local
    build: ./consumidor
    environment: &consumidor_env
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      USAR_SEMAFORO: ${USAR_SEMAFORO:-true}
      PYTHONUNBUFFERED: "1"
      CONSUMIDOR_ID: consumidor1
    depends_on: &consumidor_dep
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  consumidor2:
    image: proyecto-so1-consumidor:local
    build: ./consumidor
    environment:
      <<: *consumidor_env
      CONSUMIDOR_ID: consumidor2
    depends_on: *consumidor_dep
    restart: unless-stopped

volumes:
  mysql_datos:

